[project]
name = "licmgr"
version = "0.0.0"
description = "opa"

[project.scripts]
licmgr = "licmgr.cli:cli"

[tool.pyright]
include = ["licmgr"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["licmgr"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[build-system]
requires = ["flit_core<4"]
build-backend = "flit_core.buildapi"
